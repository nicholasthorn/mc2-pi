# Release packages (planning/RELEASES.md, phase 2).
#
# Pushing a tag v* builds the three packages and the Quest APK, runs the unit
# tests in each desktop build (the APK's arm64 Android code cannot run on the
# runner), makes full packages with the game data (the Linux and Pi ones are
# smoke-tested unpacked), and creates a DRAFT release with them, their debug
# symbols and SHA256SUMS. Nothing is published until someone reviews the draft.
# Tags with a hyphen (v0.1.0-rc1) become pre-releases.
#
# Run by hand (workflow_dispatch), nightly, or on a pull request that
# changes the packaging, it is a dry run: the same builds and packages,
# uploaded as workflow artifacts only, no tag and no release. The nightly run
# keeps the release toolchains building (Debian bookworm's GCC 12, Ubuntu
# 22.04's GCC 11): ordinary PRs only build with CI's newer compilers.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/package.sh"
      - "scripts/package_full.sh"
      - "scripts/smoke.sh"
      - "scripts/build_gamedata.sh"
      - "scripts/android/**"
      - "android/**"
      - "dist/**"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version in the package names (dry run: artifacts only, no release)"
        default: "v0.0.0-dryrun"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'v0.0.0-dryrun' }}

jobs:
  rpi:
    name: Raspberry Pi 4/400 (arm64, bookworm, GLES)
    runs-on: ubuntu-24.04-arm
    # Raspberry Pi OS 64-bit is Debian bookworm: building there keeps the
    # glibc and SDL versions the ones a Pi installs with apt
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git \
            cmake ninja-build g++ pkg-config binutils file \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev libgles-dev libegl-dev
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Configure
        # generic ARMv8-A code tuned for the Pi 4/400's Cortex-A72; it still
        # runs on any arm64 chip
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMC2_GLES=ON
          -DCMAKE_C_FLAGS=-mtune=cortex-a72 -DCMAKE_CXX_FLAGS=-mtune=cortex-a72
          "-DMC2_VERSION=$VERSION"
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: bash scripts/package.sh --build-dir build --platform rpi-arm64 --version "$VERSION" --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: package-rpi-arm64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 30 || 7 }}

  linux:
    name: Linux x64 (desktop GL)
    # the oldest base the package supports: built here, it runs on glibc 2.35+
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev libglew-dev libgl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DMC2_VERSION=$VERSION"
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: bash scripts/package.sh --build-dir build --platform linux-x86_64 --version "$VERSION" --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 30 || 7 }}

  windows:
    name: Windows x64 (MSVC, desktop GL)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      # as in ci.yml: fetch the LFS-stored 3rdparty.zip only when it changes
      - name: 3rdparty.zip LFS id
        id: lfs
        run: echo "oid=$(git lfs ls-files -l | awk '$3 == "3rdparty.zip" {print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: cache3p
        with:
          path: 3rdparty.zip
          key: lfs-3rdparty-${{ steps.lfs.outputs.oid }}
      - name: Fetch 3rdparty.zip
        if: steps.cache3p.outputs.cache-hit != 'true'
        run: git lfs pull --include=3rdparty.zip
      - name: Extract 3rdparty
        run: 7z x -y 3rdparty.zip > /dev/null
      - name: Configure
        run: >
          cmake -S . -B build64 -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$(cygpath -m "$GITHUB_WORKSPACE")/3rdparty"
          -DCMAKE_LIBRARY_ARCHITECTURE=x64
          "-DMC2_VERSION=$VERSION"
      - name: Build
        run: cmake --build build64 --config RelWithDebInfo --target mc2 mc2res_64 mc2_tests -- -m
      - name: Unit tests
        run: PATH="$GITHUB_WORKSPACE/3rdparty/lib/x64:$PATH" ctest --test-dir build64 -C RelWithDebInfo --output-on-failure
      - name: Find the C++ runtime
        id: crt
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          # one path per line, with spaces in it (C:\Program Files\...): read by line
          while IFS= read -r d; do
            d=$(cygpath -u "${d%$'\r'}")
            if [ -f "$d/vcruntime140_1.dll" ]; then echo "dir=$d" >> "$GITHUB_OUTPUT"; echo "CRT: $d"; exit 0; fi
          done < <("$vswhere" -latest -find 'VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT')
          echo "no Microsoft.VC143.CRT folder found" >&2; exit 1
      - name: Package
        run: >
          bash scripts/package.sh --build-dir build64 --platform windows-x64 --version "$VERSION" --out dist
          --vcredist "${{ steps.crt.outputs.dir }}" --thirdparty 3rdparty/lib/x64
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows-x64
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 30 || 7 }}

  quest:
    name: Meta Quest (arm64 APK, GLES, OpenXR)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Install the Android SDK parts
        # the versions in scripts/android/build.sh, which stops if one is missing
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "ndk;28.2.13676358" "cmake;3.31.6" "build-tools;36.0.0" "platforms;android-36" > /dev/null
      - name: Signing key
        # Android only installs an update signed with the same key, and
        # uninstalling deletes the game data on the headset. Without this
        # secret build.sh makes a new key, so each APK needs a clean install.
        # Tags only: dry runs have no need of the real key.
        if: github.ref_type == 'tag'
        env:
          QUEST_KEYSTORE: ${{ secrets.QUEST_KEYSTORE }}
        run: |
          if [ -n "$QUEST_KEYSTORE" ]; then
            echo "$QUEST_KEYSTORE" | base64 -d > android/debug.keystore
          else
            echo "no QUEST_KEYSTORE secret: signing with a new key"
          fi
      - name: Build
        run: JAVA_HOME="$JAVA_HOME_17_X64" MC2_VERSION="$VERSION" bash scripts/android/build.sh
      - name: Package
        run: bash scripts/android/package.sh --version "$VERSION" --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: package-quest-arm64
          path: |
            dist/*.apk
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 30 || 7 }}

  gamedata:
    name: Game data (mc2srcdata, cached)
    runs-on: ubuntu-24.04
    outputs:
      srcdata: ${{ steps.key.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      # the same key as smoke.yml, so a data build there is reused here
      - name: Cache key
        id: key
        run: |
          sha=$(git ls-remote https://github.com/alariq/mc2srcdata.git HEAD | cut -c1-12)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "key=gamedata-$sha-${{ hashFiles('data_tools/**', 'text_tool/**', 'mclib/**', 'GameOS/**', 'scripts/build_gamedata.sh') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: cache
        with:
          path: gamedata
          key: ${{ steps.key.outputs.key }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev libglew-dev libgl-dev
      # no movies: they are the only part in Git LFS, which would count against
      # the upstream repo's bandwidth, and missions run without them
      - name: Build game data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMC2_BUILD_TESTS=OFF
          cmake --build build --target aseconv makefst makersp pak text_tool
          GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 https://github.com/alariq/mc2srcdata.git srcdata
          scripts/build_gamedata.sh --src-data srcdata --build-dir build --out gamedata --no-movies
      - name: Pack
        run: tar -cf gamedata.tar gamedata
      - uses: actions/upload-artifact@v7
        with:
          name: gamedata
          path: gamedata.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 30 || 1 }}

  full:
    name: Full package ${{ matrix.platform }}
    needs: [gamedata, rpi, linux, windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the Linux packages are smoke-tested as players get them: unpacked,
          # with only the libraries INSTALL.md lists, on the oldest base for x64
          - platform: rpi-arm64
            os: ubuntu-24.04-arm
            ext: tar.gz
            prefs: minprefs
            libs: libgles2 libegl1
          - platform: linux-x86_64
            os: ubuntu-22.04
            ext: tar.gz
            prefs: hiprefs
            libs: libglew2.2 libgl1
          - platform: windows-x64
            os: ubuntu-24.04
            ext: zip
            prefs: hiprefs
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/download-artifact@v8
        with:
          name: package-${{ matrix.platform }}
          path: pkg
      - uses: actions/download-artifact@v8
        with:
          name: gamedata
      - name: Package
        run: |
          tar -xf gamedata.tar
          bash scripts/package_full.sh --package "pkg/mc2-$VERSION-${{ matrix.platform }}.${{ matrix.ext }}" --data gamedata \
            --data-version "${{ needs.gamedata.outputs.srcdata }}" --prefs ${{ matrix.prefs }} --out full
      - name: Install what a player installs
        if: matrix.libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri \
            libsdl2-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0 zlib1g ${{ matrix.libs }}
      - name: Smoke the package
        if: matrix.libs
        run: |
          mkdir unpacked
          tar -xzf "full/mc2-$VERSION-${{ matrix.platform }}-full.tar.gz" -C unpacked
          scripts/smoke.sh --game-dir "unpacked/mc2-$VERSION-${{ matrix.platform }}" --missions "mc2_01 mc2_03" \
            --timeout 900 --log-dir smoke-logs
      - uses: actions/upload-artifact@v7
        if: always() && matrix.libs
        with:
          name: full-smoke-logs-${{ matrix.platform }}
          path: smoke-logs
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: package-full-${{ matrix.platform }}
          path: full/*
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 30 || 3 }}

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [rpi, linux, windows, quest, full]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          # a rerun finishes the uploads of a draft that a failure left behind
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --draft $pre --title "MechCommander 2 $VERSION" --generate-notes
          fi
          gh release upload "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
