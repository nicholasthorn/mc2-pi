name: CI

on:
  push:
    branches: [pi-port]
  # A PR that only touches docs never needs the build. A docs-only push to a
  # PR that also changes code is caught by the "changes" job below instead.
  pull_request:
    paths-ignore:
      - "**.md"
      - "planning/**"
      - ".claude/**"
      - "docs"
      - "devdoc.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips every other job when, since a commit that already passed CI, this
  # push changed only docs or only merged the PR's base branch in
  # (scripts/ci_skip.sh). Skipped jobs count as passed. Pull requests are
  # judged per push, not on their whole diff.
  changes:
    name: Code changed?
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            git fetch -q --no-tags origin "$BEFORE" "$AFTER" 2>/dev/null || true
            bash scripts/ci_skip.sh "$BEFORE" "$AFTER" --workflow ci.yml | tee -a "$GITHUB_OUTPUT"
          elif [ "${{ github.event.action }}" = synchronize ]; then
            git fetch -q --no-tags origin "$BEFORE" "$AFTER" 2>/dev/null || true
            bash scripts/ci_skip.sh "$BEFORE" "$AFTER" --base "origin/${{ github.base_ref }}" \
              --workflow ci.yml | tee -a "$GITHUB_OUTPUT"
          else
            echo skip=false | tee -a "$GITHUB_OUTPUT"
          fi

  shaders:
    name: Shaders (GLSL ES 3.10 + GLSL 4.20)
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools
      - run: python3 scripts/validate_shaders.py
      # the Python scripts' own tests (made-up files only, no game data)
      - run: python3 -m unittest discover -s scripts/tests

  cppcheck:
    name: cppcheck (changed files)
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0
      # .cpp files this push / PR touched (header-only changes are covered by
      # the nightly full run in static.yml)
      - name: Changed files
        id: files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && \
               git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          files=$(git diff --name-only --diff-filter=AMR "$range" -- \
                  'code/*.cpp' 'mclib/*.cpp' 'GameOS/*.cpp' 'gui/*.cpp' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "changed: ${files:-none}"
      - name: Install dependencies
        if: steps.files.outputs.files != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev libglew-dev libgl-dev
      - name: Install cppcheck
        if: steps.files.outputs.files != ''
        uses: ./.github/actions/cppcheck
      - name: Check changed files against baseline
        if: steps.files.outputs.files != ''
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo > /dev/null
          python3 scripts/cppcheck_gate.py --build-dir build -j "$(nproc)" \
            --files ${{ steps.files.outputs.files }}

  sanitizers:
    name: Unit tests (ASan + UBSan)
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev libglew-dev libgl-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitizers
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMC2_SANITIZE=address,undefined
          cmake --build build --target mc2_tests
      # Leak checking stays on here (unlike the game smoke run). UBSan keeps
      # going after a finding, so make every finding fail the job.
      - name: Unit tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  linux:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 GCC (desktop GL)
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            gles: "OFF"
          - name: Linux x64 Clang (desktop GL)
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            gles: "OFF"
          - name: Linux arm64 GCC (GLES, Raspberry Pi)
            os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
            gles: "ON"
            artifact: mc2-linux-arm64-gles
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false  # 3rdparty.zip is only needed on Windows
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config clang \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev \
            libglew-dev libgl-dev libgles-dev libegl-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.cc }}-gles${{ matrix.gles }}
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DMC2_GLES=${{ matrix.gles }}
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Package
        if: matrix.artifact
        run: |
          mkdir -p dist
          cp build/mc2 build/out/res/libmc2res_64.so dist/
          cp -r shaders dist/
      - uses: actions/upload-artifact@v7
        if: matrix.artifact
        with:
          name: ${{ matrix.artifact }}
          path: dist
          retention-days: 14

  # Apple Silicon, desktop GL 4.1 (planning/future-features/MACOS.md).
  # Build, unit tests, and the game data built by the data tools on macOS (about
  # a minute); no missions: the hosted runners have no GPU.
  macos:
    name: macOS arm64 Apple Clang (desktop GL)
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Install dependencies
        run: brew install ninja ccache sdl2 sdl2_mixer sdl2_ttf glew
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-15-arm64
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_PREFIX_PATH="$(brew --prefix)"
      # -k 0: list every compile error in one run while the port is young
      - name: Build
        run: cmake --build build -- -k 0
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      # Runs the data tools on macOS, as a player building their own data
      # would (smoke.yml does the same on Linux). No LFS: only movies/ is in it.
      # The checksum lists can be compared with a Linux build of the same
      # mc2srcdata commit, written into them as the first line. Expected to
      # differ: the font bitmaps (FreeType rasterises them) and .tgl files
      # (aseconv writes uninitialised bytes, so they differ run to run on any
      # platform); hence the second list, of the files inside each .fst.
      - name: Build game data
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 https://github.com/alariq/mc2srcdata.git srcdata
          scripts/build_gamedata.sh --src-data srcdata --build-dir build --out gamedata --no-movies
          for f in data assets art.fst mission.fst minprefs.cfg; do
            [ -e "gamedata/$f" ] || { echo "missing gamedata/$f"; exit 1; }
          done
          { echo "alariq/mc2srcdata $(git -C srcdata rev-parse HEAD)"
            (cd gamedata && find . -type f | LC_ALL=C sort | xargs shasum -a 256)
          } > gamedata-macos.sha256
          { echo "alariq/mc2srcdata $(git -C srcdata rev-parse HEAD)"
            python3 scripts/fst_manifest.py gamedata/*.fst
          } > gamedata-macos-fst.sha256
          echo "$(($(wc -l < gamedata-macos.sha256) - 1)) files," \
               "$(($(wc -l < gamedata-macos-fst.sha256) - 1)) in archives, $(du -sh gamedata | cut -f1)"
      - uses: actions/upload-artifact@v7
        with:
          name: gamedata-macos-sha256
          path: gamedata-macos*.sha256
          retention-days: 14

  windows:
    name: Windows x64 MSVC (desktop GL)
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      # Fetch the LFS-stored 3rdparty.zip only when it changes, to stay within
      # the repo's free LFS bandwidth.
      - name: 3rdparty.zip LFS id
        id: lfs
        run: echo "oid=$(git lfs ls-files -l | awk '$3 == "3rdparty.zip" {print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: cache3p
        with:
          path: 3rdparty.zip
          key: lfs-3rdparty-${{ steps.lfs.outputs.oid }}
      - name: Fetch 3rdparty.zip
        if: steps.cache3p.outputs.cache-hit != 'true'
        run: git lfs pull --include=3rdparty.zip
      - name: Extract 3rdparty
        run: 7z x -y 3rdparty.zip > /dev/null
      - name: Configure
        run: >
          cmake -S . -B build64 -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$(cygpath -m "$GITHUB_WORKSPACE")/3rdparty"
          -DCMAKE_LIBRARY_ARCHITECTURE=x64
      - name: Build
        run: cmake --build build64 --config RelWithDebInfo --target mc2 mc2_tests -- -m
      - name: Unit tests
        # zlib1.dll etc. come from the extracted 3rdparty tree
        run: PATH="$GITHUB_WORKSPACE/3rdparty/lib/x64:$PATH" ctest --test-dir build64 -C RelWithDebInfo --output-on-failure
