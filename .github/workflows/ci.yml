name: CI

on:
  push:
    branches: [pi-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shaders:
    name: Shaders (GLSL ES 3.10 + GLSL 4.20)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools
      - run: python3 scripts/validate_shaders.py

  cppcheck:
    name: cppcheck (changed files)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0
      # .cpp files this push / PR touched (header-only changes are covered by
      # the nightly full run in static.yml)
      - name: Changed files
        id: files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && \
               git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          files=$(git diff --name-only --diff-filter=AMR "$range" -- \
                  'code/*.cpp' 'mclib/*.cpp' 'GameOS/*.cpp' 'gui/*.cpp' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "changed: ${files:-none}"
      - name: Install dependencies
        if: steps.files.outputs.files != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config cppcheck \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev libglew-dev libgl-dev
      - name: Check changed files against baseline
        if: steps.files.outputs.files != ''
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo > /dev/null
          python3 scripts/cppcheck_gate.py --build-dir build -j "$(nproc)" \
            --files ${{ steps.files.outputs.files }}

  sanitizers:
    name: Unit tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev libglew-dev libgl-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitizers
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMC2_SANITIZE=address,undefined
          cmake --build build --target mc2_tests
      # Leak checking stays on here (unlike the game smoke run). UBSan keeps
      # going after a finding, so make every finding fail the job.
      - name: Unit tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 GCC (desktop GL)
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            gles: "OFF"
          - name: Linux x64 Clang (desktop GL)
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            gles: "OFF"
          - name: Linux arm64 GCC (GLES, Raspberry Pi)
            os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
            gles: "ON"
            artifact: mc2-linux-arm64-gles
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false  # 3rdparty.zip is only needed on Windows
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config clang \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev \
            libglew-dev libgl-dev libgles-dev libegl-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.cc }}-gles${{ matrix.gles }}
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DMC2_GLES=${{ matrix.gles }}
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Package
        if: matrix.artifact
        run: |
          mkdir -p dist
          cp build/mc2 build/out/res/libmc2res_64.so dist/
          cp -r shaders dist/
      - uses: actions/upload-artifact@v7
        if: matrix.artifact
        with:
          name: ${{ matrix.artifact }}
          path: dist
          retention-days: 14

  windows:
    name: Windows x64 MSVC (desktop GL)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      # Fetch the LFS-stored 3rdparty.zip only when it changes, to stay within
      # the repo's free LFS bandwidth.
      - name: 3rdparty.zip LFS id
        id: lfs
        run: echo "oid=$(git lfs ls-files -l | awk '$3 == "3rdparty.zip" {print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: cache3p
        with:
          path: 3rdparty.zip
          key: lfs-3rdparty-${{ steps.lfs.outputs.oid }}
      - name: Fetch 3rdparty.zip
        if: steps.cache3p.outputs.cache-hit != 'true'
        run: git lfs pull --include=3rdparty.zip
      - name: Extract 3rdparty
        run: 7z x -y 3rdparty.zip > /dev/null
      - name: Configure
        run: >
          cmake -S . -B build64 -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$(cygpath -m "$GITHUB_WORKSPACE")/3rdparty"
          -DCMAKE_LIBRARY_ARCHITECTURE=x64
      - name: Build
        run: cmake --build build64 --config RelWithDebInfo --target mc2 mc2_tests -- -m
      - name: Unit tests
        # zlib1.dll etc. come from the extracted 3rdparty tree
        run: PATH="$GITHUB_WORKSPACE/3rdparty/lib/x64:$PATH" ctest --test-dir build64 -C RelWithDebInfo --output-on-failure
