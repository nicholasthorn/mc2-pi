name: Smoke

# Launches real missions headless (Xvfb + Mesa llvmpipe) and fails on a crash,
# hang, GL/shader error or STOP line: scripts/smoke.sh. Nightly, on demand, and
# on PRs that touch code (the batch check in .claude/rules/agent-workflow.md);
# not per push: it needs the built game data and takes several minutes.
#
# What a run covers:
#   - nightly, on demand, and PRs that change multiplayer code
#     (scripts/ci_multiplayer.sh): everything, on all three configurations.
#   - other code PRs: the five missions on all three and the replay; of the
#     multiplayer steps, the host and the two-process battle on the sanitized job,
#     no game modes. Sanitized because most multiplayer crashes so far were found
#     there, with the stack that names them.
#   - nightly and on demand only: the steps named "Exhaustive", which look for
#     what a PR's run is too short to find. Nobody waits on these.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "code/**"
      - "mclib/**"
      - "GameOS/**"
      - "gui/**"
      - "res/**"
      - "shaders/**"
      - "data_tools/**"
      - "text_tool/**"
      - "cmake/**"
      - "**/CMakeLists.txt"
      - "scripts/smoke.sh"
      - "scripts/net_smoke.sh"
      - "scripts/ci_multiplayer.sh"
      - "bench/net*.fit"
      - "scripts/build_gamedata.sh"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

# One run per PR (a new push cancels the PR's previous run) and one for the
# nightly / manual runs, so they do not cancel each other.
concurrency:
  group: smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MISSIONS: "mc2_01 mc2_03 mc2_10 mc2_17 mc2_24"
  # The rest of the campaign, for the nightly run.
  OTHER_MISSIONS: >-
    mc2_02 mc2_04 mc2_05 mc2_06 mc2_07 mc2_08 mc2_09 mc2_11 mc2_12 mc2_13
    mc2_14 mc2_15 mc2_16 mc2_18 mc2_19 mc2_20 mc2_21 mc2_22 mc2_23
  # The multiplayer maps, each with the host's code and no scenario. mc2_m09 is
  # in the multiplayer host step; mc2_m02a and mc2_m02b have never been run.
  OTHER_NET_MAPS: "mc2_m01 mc2_m02 mc2_m03 mc2_m04 mc2_m05 mc2_m06 mc2_m07 mc2_m08 mc2_m10"
  # The support battle, shared by its game-modes line and the nightly repeats so
  # the two stay the same battle.
  SUPPORT_BATTLE: >-
    --mission mc2_m08 --scenario ${{ github.workspace }}/bench/net_support.fit --support
    --world-events no --frames 200000
  SUPPORT_REPEATS: 5

jobs:
  # A push to a PR that, since a commit that already passed this workflow,
  # changed only docs or only merged the base branch in skips the run
  # (scripts/ci_skip.sh); the smoke job skips with the data job. Nightly and
  # manual runs always run.
  changes:
    name: Code changed?
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      multiplayer: ${{ steps.multiplayer.outputs.multiplayer }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event.action }}" = synchronize ]; then
            git fetch -q --no-tags origin "$BEFORE" "$AFTER" 2>/dev/null || true
            bash scripts/ci_skip.sh "$BEFORE" "$AFTER" --base "origin/${{ github.base_ref }}" \
              --workflow smoke.yml | tee -a "$GITHUB_OUTPUT"
          else
            echo skip=false | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Multiplayer code changed?
        id: multiplayer
        env:
          BASE_REF: ${{ github.base_ref }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            bash scripts/ci_multiplayer.sh "origin/$BASE_REF" "$AFTER" | tee -a "$GITHUB_OUTPUT"
          else
            echo multiplayer=true | tee -a "$GITHUB_OUTPUT"
          fi

  data:
    name: Game data (mc2srcdata, cached)
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      # Rebuild only when mc2srcdata or the data tools change. Data is
      # platform independent, so the arm64 job reuses this cache. The tools
      # link all of mclib (with mlr, stuff, gosfx) and GameOS, so all of it
      # is hashed: a rebuild costs about two minutes.
      - name: Cache key
        id: key
        run: |
          sha=$(git ls-remote https://github.com/alariq/mc2srcdata.git HEAD | cut -c1-12)
          echo "key=gamedata-$sha-${{ hashFiles('data_tools/**', 'text_tool/**', 'mclib/**', 'GameOS/**', 'scripts/build_gamedata.sh') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: cache
        with:
          path: gamedata
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev libglew-dev libgl-dev
      - name: Build data tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMC2_BUILD_TESTS=OFF
          cmake --build build --target aseconv makefst makersp pak text_tool
      # Only movies/ is in Git LFS: skip the LFS download entirely (it would
      # count against the upstream repo's bandwidth) and build without movies.
      - name: Build game data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 https://github.com/alariq/mc2srcdata.git srcdata
          scripts/build_gamedata.sh --src-data srcdata --build-dir build --out gamedata --no-movies
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: gamedata
          key: ${{ steps.key.outputs.key }}

  smoke:
    name: Smoke ${{ matrix.name }}
    needs: [changes, data]
    runs-on: ${{ matrix.os }}
    # A hang is killed per mission (--timeout), but many hangs in a row could run
    # to GitHub's 6 hours. Slowest so far: about 45 minutes on a PR, 74 nightly.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 90 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (desktop GL)
            os: ubuntu-24.04
            gles: "OFF"
          - name: Linux arm64 (GLES, Raspberry Pi)
            os: ubuntu-24.04-arm
            gles: "ON"
          - name: Linux x64 (desktop GL, ASan + UBSan)
            os: ubuntu-24.04
            gles: "OFF"
            sanitize: address,undefined
    env:
      # Sanitizer runtime options (only matter for the sanitize entry).
      # alloc_dealloc_mismatch: Mesa's swrast driver trips it while loading.
      # detect_leaks: the game and Mesa leak at exit; leak checking runs on
      # the unit tests instead (ci.yml). There is no UBSan baseline: any
      # finding fails the run.
      ASAN_OPTIONS: alloc_dealloc_mismatch=0:detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config xvfb xauth \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev \
            libglew-dev libgl-dev libgles-dev libegl-dev libgl1-mesa-dri
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: smoke-${{ matrix.os }}-gles${{ matrix.gles }}${{ matrix.sanitize && '-san' || '' }}
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMC2_BUILD_TESTS=OFF -DMC2_GLES=${{ matrix.gles }} \
            -DMC2_SANITIZE=${{ matrix.sanitize }}
          cmake --build build --target mc2 mc2res_64 -- -k 0   # report every failing file
      - uses: actions/cache/restore@v6
        id: gamedata
        with:
          path: gamedata
          key: ${{ needs.data.outputs.key }}
          fail-on-cache-miss: true
      - name: Smoke
        # Longer runs reach combat, triggers and in-mission videos; 300 frames
        # missed a crash that 3000 found.
        run: >
          scripts/smoke.sh --game-dir gamedata --build-dir build --missions "$MISSIONS"
          --frames ${{ matrix.frames || 3000 }} --timeout 1200 --log-dir smoke-logs
      - name: Deterministic replay
        # Two runs of a combat mission with a fixed step and seed must end in
        # the same game state (smoke.sh --deterministic, sound off). One
        # entry is enough: GL and GLES end in the same state.
        if: matrix.gles == 'OFF' && !matrix.sanitize
        run: >
          scripts/smoke.sh --game-dir gamedata --missions "mc2_10" --frames 1000
          --ui "" --deterministic --timeout 1200 --log-dir smoke-logs/deterministic
      - name: Multiplayer host (no network)
        # The host's side of the multiplayer code on two-player maps. Units idle
        # on mc2_m09; the scenario makes them fight on mc2_m08, damage on.
        if: needs.changes.outputs.multiplayer != 'false' || matrix.sanitize
        run: |
          scripts/smoke.sh --game-dir gamedata --missions "mc2_m09" --frames 3000 \
            --ui "" --nethost 2 --timeout 1200 --log-dir smoke-logs/nethost
          scripts/smoke.sh --game-dir gamedata --missions "mc2_m08" --frames 3000 \
            --ui "" --nethost 2 --scenario "$PWD/bench/nethost_m08.fit" --timeout 1200 \
            --log-dir smoke-logs/nethost-battle
      - name: Multiplayer, two processes
        # A host and a client on this machine play a battle to its result, on a
        # clean network and then at the plan's bar: 100 ms each way and 2% loss.
        if: needs.changes.outputs.multiplayer != 'false' || matrix.sanitize
        run: |
          scripts/net_smoke.sh --game-dir gamedata --log-dir smoke-logs/net
          scripts/net_smoke.sh --game-dir gamedata --lag-ms 100 --loss-percent 2 --log-dir smoke-logs/net-lag
      - name: Multiplayer, the game modes
        # Each of the stock maps' modes, on a map of that mode. Where an HQ decides it,
        # the host's team takes one partway in, so it must win.
        if: needs.changes.outputs.multiplayer != 'false'
        run: |
          capture="--scenario $PWD/bench/net_capture.fit --expect-winner 0 --world-events no"
          scripts/net_smoke.sh --game-dir gamedata --mission mc2_m08 $capture --log-dir smoke-logs/net-capture-base
          scripts/net_smoke.sh --game-dir gamedata --mission mc2_m05 $capture --log-dir smoke-logs/net-king-of-the-hill
          scripts/net_smoke.sh --game-dir gamedata --mission mc2_m06 $capture --log-dir smoke-logs/net-last-on-the-hill
          scripts/net_smoke.sh --game-dir gamedata --mission mc2_m07 $capture --log-dir smoke-logs/net-territories
          scripts/net_smoke.sh --game-dir gamedata --mission mc2_m04 --scenario "$PWD/bench/net_timed.fit" \
            --world-events no --log-dir smoke-logs/net-last-man-standing
          # support vehicles, a recovery and every kind of order, a repair truck, turrets firing
          scripts/net_smoke.sh --game-dir gamedata --mission mc2_m09 --scenario "$PWD/bench/net_turret.fit" --expect-turrets \
            --world-events no --frames 200000 --log-dir smoke-logs/net-turret
          scripts/net_smoke.sh --game-dir gamedata $SUPPORT_BATTLE --log-dir smoke-logs/net-support
          scripts/net_smoke.sh --game-dir gamedata --mission mc2_m08 --scenario "$PWD/bench/net_repair.fit" --expect-repairs \
            --world-events no --frames 200000 --log-dir smoke-logs/net-repair
          scripts/net_smoke.sh --game-dir gamedata --mission mc2_m08 --scenario "$PWD/bench/net_order_m08.fit" \
            --expect-winner 1 --world-events no --dial --log-dir smoke-logs/net-ordered-capture-base
          # found by asking the local network, not by address
          scripts/net_smoke.sh --game-dir gamedata --mission mc2_m08 --scenario "$PWD/bench/net_capture.fit" \
            --expect-winner 0 --world-events no --lan --log-dir smoke-logs/net-found-on-lan
          # the same, by way of a lobby: only the host says which mission
          scripts/net_smoke.sh --game-dir gamedata --mission mc2_m08 --scenario "$PWD/bench/net_capture.fit" \
            --expect-winner 0 --world-events no --lan --lobby --log-dir smoke-logs/net-lobby
          # and for a host that cannot be reached, which calls the client
          scripts/net_smoke.sh --game-dir gamedata --mission mc2_m08 --scenario "$PWD/bench/net_capture.fit" \
            --expect-winner 0 --world-events no --dial --lobby --log-dir smoke-logs/net-lobby-dial
          scripts/net_smoke.sh --game-dir gamedata --mission mc2_m05 --scenario "$PWD/bench/net_order_m05.fit" \
            --expect-winner 1 --world-events no --log-dir smoke-logs/net-ordered-hill
      # Nightly and on demand. These run after a failure above, so one problem does
      # not hide another, but not without the game data, which is only restored
      # after a good build. The network steps run on the sanitized job only: it is
      # the one that has found multiplayer crashes, with the stack that names them.
      - name: Exhaustive, the rest of the campaign
        if: ${{ !cancelled() && steps.gamedata.outcome == 'success' && github.event_name != 'pull_request' }}
        run: >
          scripts/smoke.sh --game-dir gamedata --missions "$OTHER_MISSIONS" --ui ""
          --frames 3000 --timeout 1200 --log-dir smoke-logs/campaign
      - name: Exhaustive, the multiplayer maps
        if: ${{ !cancelled() && steps.gamedata.outcome == 'success' && github.event_name != 'pull_request' }}
        run: >
          scripts/smoke.sh --game-dir gamedata --missions "$OTHER_NET_MAPS" --frames 3000
          --ui "" --nethost 2 --timeout 1200 --log-dir smoke-logs/nethost-maps
      - name: Exhaustive, a bad network
        # The far end of the plan's range. NETWORKING.md has this battle playing
        # to a result with no armour differences.
        if: ${{ !cancelled() && steps.gamedata.outcome == 'success' && github.event_name != 'pull_request' && matrix.sanitize }}
        run: >
          scripts/net_smoke.sh --game-dir gamedata --lag-ms 250 --loss-percent 5
          --log-dir smoke-logs/net-bad
      - name: Exhaustive, the support battle again
        # Two processes do not play a battle the same way twice, and some crashes
        # need a rare moment: one here took a vehicle killed in the few seconds
        # before its VTOL landed, and 50 local games missed it. Every repeat runs,
        # so a failure shows how often it happens.
        if: ${{ !cancelled() && steps.gamedata.outcome == 'success' && github.event_name != 'pull_request' && matrix.sanitize }}
        run: |
          failed=0
          for i in $(seq "$SUPPORT_REPEATS"); do
            scripts/net_smoke.sh --game-dir gamedata $SUPPORT_BATTLE --log-dir "smoke-logs/net-support-repeat-$i" || failed=$((failed + 1))
          done
          echo "support battle: $failed of $SUPPORT_REPEATS failed"
          [ "$failed" -eq 0 ]
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-logs-${{ matrix.os }}-gles${{ matrix.gles }}${{ matrix.sanitize && '-san' || '' }}
          path: smoke-logs
          retention-days: 14
