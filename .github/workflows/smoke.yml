name: Smoke

# Launches real missions headless (Xvfb + Mesa llvmpipe) and fails on a crash,
# hang, GL/shader error or STOP line: scripts/smoke.sh. Nightly, on demand, and
# on PRs that touch code (the batch check in .claude/rules/agent-workflow.md);
# not per push: it needs the built game data and takes several minutes.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "code/**"
      - "mclib/**"
      - "GameOS/**"
      - "gui/**"
      - "res/**"
      - "shaders/**"
      - "data_tools/**"
      - "text_tool/**"
      - "cmake/**"
      - "**/CMakeLists.txt"
      - "scripts/smoke.sh"
      - "scripts/build_gamedata.sh"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

# One run per PR (a new push cancels the PR's previous run) and one for the
# nightly / manual runs, so they do not cancel each other.
concurrency:
  group: smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MISSIONS: "mc2_01 mc2_03 mc2_10 mc2_17 mc2_24"

jobs:
  # A push to a PR that changed only docs since a commit that already passed
  # this workflow skips the run (scripts/ci_docs_only.sh); the smoke job
  # skips with the data job. Nightly and manual runs always run.
  changes:
    name: Docs-only push?
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.gate.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event.action }}" = synchronize ]; then
            git fetch -q --no-tags origin "$BEFORE" "$AFTER" 2>/dev/null || true
            bash scripts/ci_docs_only.sh "$BEFORE" "$AFTER" smoke.yml | tee -a "$GITHUB_OUTPUT"
          else
            echo docs_only=false | tee -a "$GITHUB_OUTPUT"
          fi

  data:
    name: Game data (mc2srcdata, cached)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      # Rebuild only when mc2srcdata or the data tools change. Data is
      # platform independent, so the arm64 job reuses this cache. The tools
      # link all of mclib (with mlr, stuff, gosfx) and GameOS, so all of it
      # is hashed: a rebuild costs about two minutes.
      - name: Cache key
        id: key
        run: |
          sha=$(git ls-remote https://github.com/alariq/mc2srcdata.git HEAD | cut -c1-12)
          echo "key=gamedata-$sha-${{ hashFiles('data_tools/**', 'text_tool/**', 'mclib/**', 'GameOS/**', 'scripts/build_gamedata.sh') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: cache
        with:
          path: gamedata
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev libglew-dev libgl-dev
      - name: Build data tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMC2_BUILD_TESTS=OFF
          cmake --build build --target aseconv makefst makersp pak text_tool
      # Only movies/ is in Git LFS: skip the LFS download entirely (it would
      # count against the upstream repo's bandwidth) and build without movies.
      - name: Build game data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 https://github.com/alariq/mc2srcdata.git srcdata
          scripts/build_gamedata.sh --src-data srcdata --build-dir build --out gamedata --no-movies
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: gamedata
          key: ${{ steps.key.outputs.key }}

  smoke:
    name: Smoke ${{ matrix.name }}
    needs: data
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (desktop GL)
            os: ubuntu-24.04
            gles: "OFF"
          - name: Linux arm64 (GLES, Raspberry Pi)
            os: ubuntu-24.04-arm
            gles: "ON"
          - name: Linux x64 (desktop GL, ASan + UBSan)
            os: ubuntu-24.04
            gles: "OFF"
            sanitize: address,undefined
    env:
      # Sanitizer runtime options (only matter for the sanitize entry).
      # alloc_dealloc_mismatch: Mesa's swrast driver trips it while loading.
      # detect_leaks: the game and Mesa leak at exit; leak checking runs on
      # the unit tests instead (ci.yml). There is no UBSan baseline: any
      # finding fails the run.
      ASAN_OPTIONS: alloc_dealloc_mismatch=0:detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config xvfb xauth \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev zlib1g-dev \
            libglew-dev libgl-dev libgles-dev libegl-dev libgl1-mesa-dri
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: smoke-${{ matrix.os }}-gles${{ matrix.gles }}${{ matrix.sanitize && '-san' || '' }}
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMC2_BUILD_TESTS=OFF -DMC2_GLES=${{ matrix.gles }} \
            -DMC2_SANITIZE=${{ matrix.sanitize }}
          cmake --build build --target mc2 mc2res_64 -- -k 0   # report every failing file
      - uses: actions/cache/restore@v6
        with:
          path: gamedata
          key: ${{ needs.data.outputs.key }}
          fail-on-cache-miss: true
      - name: Smoke
        # Longer runs reach combat, triggers and in-mission videos; 300 frames
        # missed a crash that 3000 found.
        run: >
          scripts/smoke.sh --game-dir gamedata --build-dir build --missions "$MISSIONS"
          --frames ${{ matrix.frames || 3000 }} --timeout 1200 --log-dir smoke-logs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-logs-${{ matrix.os }}-gles${{ matrix.gles }}${{ matrix.sanitize && '-san' || '' }}
          path: smoke-logs
          retention-days: 14
